<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик маршрутов транспорта</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        #map {
            height: 600px;
            width: 100%;
            border-radius: 10px;
            z-index: 1;
        }
        .leaflet-container {
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Планировщик маршрутов транспорта</h1>
            <div class="controls">
                <button id="addPointMode" class="btn-primary">Добавить точку</button>
                <button id="startRouteBtn" class="btn-start">Старт</button>
                <button id="clearAll" class="btn-danger">Очистить все</button>
            </div>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <div class="panel">
                    <h3>Транспорт</h3>
                    <div id="vehiclesList" class="vehicles-list"></div>
                </div>

                <div class="panel">
                    <h3>Доступные действия</h3>
                    <div class="actions-list">
                        {% for action in actions %}
                        <div class="action-item" data-action-id="{{ action.id }}">
                            <span class="action-name">{{ action.name }}</span>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="panel">
                    <h3>Активный маршрут</h3>
                    <div id="activeRouteInfo" class="route-info">
                        <p>Выберите транспорт для просмотра маршрута</p>
                    </div>
                </div>
            </div>

            <div class="map-container">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <div id="segmentActionsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Действия на участке маршрута</h3>
            <p id="segmentInfo" class="modal-subtitle"></p>
            <div id="segmentActionCheckboxes" class="action-checkboxes">
                {% for action in actions %}
                <label class="action-checkbox">
                    <input type="checkbox" value="{{ action.id }}">
                    {{ action.name }}
                </label>
                {% endfor %}
            </div>
            <button id="saveSegmentActions" class="btn-primary">Сохранить для участка</button>
        </div>
    </div>

    <script>
        let map = L.map('map').setView([55.7558, 37.6173], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const VEHICLES = {{ vehicles|tojson }};
        const ACTIONS = {{ actions|tojson }};

        let markers = [];
        let markerObjects = [];
        let polylines = {};
        let currentPointLatLng = null;
        let routes = {};
        let activeVehicleId = null;
        let currentSegmentIndex = null;

        $(document).ready(function() {
            initVehicles();
            loadAllPoints();
            loadAllRoutes();
        });

        function initVehicles() {
            const vehiclesList = $('#vehiclesList');
            vehiclesList.empty();

            VEHICLES.forEach(vehicle => {
                const vehicleElement = $(`
                    <div class="vehicle-item" data-vehicle-id="${vehicle.id}" style="border-left-color: ${vehicle.color}">
                        <div class="vehicle-header">
                            <span class="vehicle-name">${vehicle.display_name}</span>
                            <span class="vehicle-tech">${vehicle.name}</span>
                        </div>
                        <div class="vehicle-stats">
                            <span class="points-count" id="vehicle-points-${vehicle.id}">0 точек</span>
                        </div>
                        <button class="btn-small select-vehicle-route" onclick="selectActiveVehicle(${vehicle.id})">Выбрать</button>
                    </div>
                `);
                vehiclesList.append(vehicleElement);
            });
        }

        window.selectActiveVehicle = function(vehicleId) {
            activeVehicleId = vehicleId;

            $('.vehicle-item').removeClass('active');
            $(`[data-vehicle-id="${vehicleId}"]`).addClass('active');

            updateActiveRouteInfo(vehicleId);
        };

        function updateActiveRouteInfo(vehicleId) {
            const vehicle = VEHICLES.find(v => v.id === vehicleId);
            const route = routes[vehicleId];
            const vehiclePoints = markers.filter(m => m.vehicle_id === vehicleId)
                                        .sort((a, b) => a.id - b.id);

            let html = `<h4>${vehicle.display_name} (${vehicle.name})</h4>`;

            if (vehiclePoints.length === 0) {
                html += '<p>Нет точек маршрута</p>';
            } else {
                html += `<p>Точек на маршруте: ${vehiclePoints.length}</p>`;
                html += '<div class="route-segments">';

                for (let i = 0; i < vehiclePoints.length - 1; i++) {
                    const fromPoint = vehiclePoints[i];
                    const toPoint = vehiclePoints[i + 1];
                    const segmentActions = route?.segments?.[i] || [];

                    const actionNames = segmentActions.map(actionId => {
                        const action = ACTIONS.find(a => a.id === actionId);
                        return action ? action.name : '';
                    }).join(', ');

                    html += `
                        <div class="route-segment">
                            <div class="segment-header">
                                <span class="segment-title">Участок ${i + 1}: Точка ${fromPoint.number} → Точка ${toPoint.number}</span>
                                <button class="btn-small btn-primary" onclick="editSegment(${vehicleId}, ${i})">Действия</button>
                            </div>
                            <div class="segment-actions">
                                ${actionNames || 'Нет действий'}
                            </div>
                        </div>
                    `;
                }

                html += '</div>';
            }

            $('#activeRouteInfo').html(html);
        }

        window.editSegment = function(vehicleId, segmentIndex) {
            activeVehicleId = vehicleId;
            currentSegmentIndex = segmentIndex;

            const vehiclePoints = markers.filter(m => m.vehicle_id === vehicleId)
                                        .sort((a, b) => a.id - b.id);
            const fromPoint = vehiclePoints[segmentIndex];
            const toPoint = vehiclePoints[segmentIndex + 1];

            $('#segmentInfo').text(`Участок ${segmentIndex + 1}: от точки ${fromPoint.number} до точки ${toPoint.number}`);

            const route = routes[vehicleId];
            const segmentActions = route?.segments?.[segmentIndex] || [];

            $('#segmentActionCheckboxes input').prop('checked', false);
            segmentActions.forEach(actionId => {
                $(`#segmentActionCheckboxes input[value="${actionId}"]`).prop('checked', true);
            });

            $('#segmentActionsModal').show();
        };

        $('#saveSegmentActions').click(function() {
            const selectedActions = [];
            $('#segmentActionCheckboxes input:checked').each(function() {
                selectedActions.push(parseInt($(this).val()));
            });

            const vehiclePoints = markers.filter(m => m.vehicle_id === activeVehicleId)
                                        .sort((a, b) => a.id - b.id);
            const pointIds = vehiclePoints.map(p => p.id);

            let route = routes[activeVehicleId];
            const segments = route?.segments || [];
            segments[currentSegmentIndex] = selectedActions;

            const routeData = {
                vehicle_id: activeVehicleId,
                point_ids: pointIds,
                segments: segments
            };

            if (route) {
                $.ajax({
                    url: `/api/routes/${route.id}`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(routeData),
                    success: function(response) {
                        routes[activeVehicleId] = response.route;
                        updateActiveRouteInfo(activeVehicleId);
                        $('#segmentActionsModal').hide();
                    }
                });
            } else {
                $.ajax({
                    url: '/api/routes',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(routeData),
                    success: function(response) {
                        routes[activeVehicleId] = response.route;
                        updateActiveRouteInfo(activeVehicleId);
                        $('#segmentActionsModal').hide();
                    }
                });
            }
        });

        let addMode = false;

        $('#addPointMode').click(function() {
            if (!activeVehicleId) {
                return;
            }
            addMode = !addMode;
            $(this).toggleClass('active');
        });

        map.on('click', function(e) {
            if (addMode) {
                if (!activeVehicleId) {
                    addMode = false;
                    $('#addPointMode').removeClass('active');
                    return;
                }
                currentPointLatLng = e.latlng;
                addPoint(currentPointLatLng.lat, currentPointLatLng.lng, activeVehicleId);
            }
        });

        function addPoint(lat, lng, vehicleId) {
            $.ajax({
                url: '/api/points',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    lat: lat,
                    lng: lng,
                    vehicle_id: vehicleId
                }),
                success: function(response) {
                    createMarker(response.point);
                    markers.push(response.point);

                    loadVehiclePoints(vehicleId);
                    updateVehicleStats(vehicleId);
                    updateActiveRouteInfo(vehicleId);
                }
            });
        }

        function createMarker(point) {
            const vehicle = VEHICLES.find(v => v.id === point.vehicle_id);

            const marker = L.marker([point.lat, point.lng], {
                icon: L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background-color: ${vehicle.color}; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">${point.number}</div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                })
            }).addTo(map);

            marker.bindPopup(`
                <b>Точка ${point.number}</b><br>
                Транспорт: ${vehicle.display_name} (${vehicle.name})<br>
                Координаты: ${point.lat.toFixed(4)}, ${point.lng.toFixed(4)}<br>
                <button onclick="deleteMapPoint(${point.id})" style="margin-top: 5px; padding: 3px 10px; background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer;">Удалить точку</button>
            `);

            markerObjects.push({
                id: point.id,
                marker: marker,
                vehicle_id: point.vehicle_id,
                number: point.number
            });
        }

        window.deleteMapPoint = function(pointId) {
            const point = markers.find(m => m.id === pointId);
            if (!point) return;

            const vehicleId = point.vehicle_id;

            $.ajax({
                url: `/api/points/${pointId}`,
                method: 'DELETE',
                success: function() {
                    const markerObj = markerObjects.find(m => m.id === pointId);
                    if (markerObj) {
                        map.removeLayer(markerObj.marker);
                        markerObjects = markerObjects.filter(m => m.id !== pointId);
                    }

                    markers = markers.filter(m => m.id !== pointId);

                    loadVehiclePoints(vehicleId);
                    updateVehicleStats(vehicleId);

                    if (routes[vehicleId]) {
                        delete routes[vehicleId];
                    }

                    if (activeVehicleId === vehicleId) {
                        updateActiveRouteInfo(vehicleId);
                    }
                }
            });
        };

        function loadVehiclePoints(vehicleId) {
            $.get(`/api/vehicles/${vehicleId}/points`, function(points) {
                drawRouteLine(vehicleId, points);
            });
        }

        function loadAllPoints() {
            $.get('/api/points', function(data) {
                markers = data;
                data.forEach(point => {
                    createMarker(point);
                });

                const vehicleGroups = {};
                data.forEach(point => {
                    if (!vehicleGroups[point.vehicle_id]) {
                        vehicleGroups[point.vehicle_id] = [];
                    }
                    vehicleGroups[point.vehicle_id].push(point);
                });

                Object.keys(vehicleGroups).forEach(vehicleId => {
                    vehicleGroups[vehicleId].sort((a, b) => a.id - b.id);
                    drawRouteLine(parseInt(vehicleId), vehicleGroups[vehicleId]);
                    updateVehicleStats(parseInt(vehicleId));
                });
            });
        }

        function loadAllRoutes() {
            $.get('/api/routes', function(data) {
                data.forEach(route => {
                    routes[route.vehicle_id] = route;
                });

                if (activeVehicleId) {
                    updateActiveRouteInfo(activeVehicleId);
                }
            });
        }

        function drawRouteLine(vehicleId, points) {
            if (polylines[vehicleId]) {
                map.removeLayer(polylines[vehicleId]);
            }

            if (points.length < 2) return;

            const sortedPoints = [...points].sort((a, b) => a.id - b.id);
            const latlngs = sortedPoints.map(p => [p.lat, p.lng]);

            const vehicle = VEHICLES.find(v => v.id === vehicleId);

            polylines[vehicleId] = L.polyline(latlngs, {
                color: vehicle.color,
                weight: 4,
                opacity: 0.7,
                lineJoin: 'round'
            }).addTo(map);
        }

        function updateVehicleStats(vehicleId) {
            const vehiclePoints = markers.filter(m => m.vehicle_id === vehicleId);
            $(`#vehicle-points-${vehicleId}`).text(vehiclePoints.length + ' точек');
        }

        $('#startRouteBtn').click(function() {
            const activeRoutes = Object.values(routes);

            if (activeRoutes.length === 0) {
                return;
            }

            $(this).css('background-color', '#27ae60');
            setTimeout(() => {
                $(this).css('background-color', '#f39c12');
            }, 200);
        });

        $('#clearAll').click(function() {
            markerObjects.forEach(m => map.removeLayer(m.marker));
            Object.values(polylines).forEach(p => map.removeLayer(p));

            markers = [];
            markerObjects = [];
            polylines = {};
            routes = {};
            activeVehicleId = null;

            VEHICLES.forEach(vehicle => {
                $(`#vehicle-points-${vehicle.id}`).text('0 точек');
            });

            $('#activeRouteInfo').html('<p>Выберите транспорт для просмотра маршрута</p>');
            $('.vehicle-item').removeClass('active');

            $.ajax({ url: '/api/points', method: 'GET' }).then(points => {
                points.forEach(p => $.ajax({ url: `/api/points/${p.id}`, method: 'DELETE' }));
            });

            $.ajax({ url: '/api/routes', method: 'GET' }).then(routes => {
                routes.forEach(r => $.ajax({ url: `/api/routes/${r.id}`, method: 'DELETE' }));
            });
        });

        $('.close').click(function() {
            $('.modal').hide();
        });

        $(window).click(function(event) {
            if ($(event.target).hasClass('modal')) {
                $('.modal').hide();
            }
        });
    </script>
</body>
</html>
